<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pasta ve Havai Fişek</title>
    <style>
        /* --- GENEL AYARLAR --- */
        body {
            background: #000; /* Havai fişekler için siyah arka plan */
            margin: 0;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* --- ARKA PLAN (HAVAİ FİŞEK) --- */
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 0; /* En arkada durması için */
        }

        /* --- ÖN PLAN (PASTA VE YAZI) --- */
        
        /* Yazı Stili */
        .message-container {
            position: absolute;
            top: 15%;
            width: 100%;
            text-align: center;
            z-index: 10; /* Havai fişeklerin önünde */
            pointer-events: none; /* Tıklamaları engellemesin */
        }

        .message-title {
            font-size: 40px;
            color: #fff; /* Siyah zemin üzerine beyaz yazı */
            font-weight: bold;
            text-shadow: 0 0 10px #00a8ff, 0 0 20px #00a8ff; /* Mavi neon parlama efekti */
            opacity: 0;
            animation: textFadeIn 1s 1s ease-out forwards;
        }

        .message-name {
            font-size: 60px;
            color: #fbc531; /* Altın sarısı renk */
            font-weight: bold;
            margin-top: 10px;
            text-shadow: 0 0 10px #e1b12c, 0 0 20px #e1b12c;
            opacity: 0;
            animation: textFadeIn 1s 2s ease-out forwards;
        }

        .message-note {
            font-size: 20px;
            color: #ccc;
            margin-top: 15px;
            opacity: 0;
            animation: textFadeIn 1s 3s ease-out forwards;
        }

        /* Pasta Kapsayıcı */
        .cake-wrapper {
            position: relative;
            z-index: 10; /* Havai fişeklerin önünde */
            margin-top: 150px;
        }

        /* Tabak */
        .plate {
            width: 350px;
            height: 15px;
            background: #dfe6e9;
            border-radius: 10px;
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 5px 15px rgba(255,255,255,0.2); /* Siyah zeminde parlak gölge */
        }

        /* Pastanın Keki */
        .cake {
            width: 300px;
            height: 120px;
            background: #2f3640; /* Koyu lacivert/gri tonlarında şık bir pasta */
            position: relative;
            border-radius: 10px 10px 5px 5px;
            display: flex;
            justify-content: center;
            box-shadow: inset -10px 0 rgba(0,0,0,0.5);
        }

        /* Krema */
        .icing {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 40px;
            background: #dcdde1; /* Beyaz-gri krema */
            border-radius: 10px 10px 30px 30px;
            z-index: 1;
        }

        /* Mum Konteynır */
        .candle-container {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 8px;
            position: absolute;
            top: -50px;
            z-index: 2;
            width: 100%;
        }

        /* Mumlar */
        .candle {
            background: repeating-linear-gradient(45deg, #00a8ff, #00a8ff 5px, #0097e6 5px, #0097e6 10px); /* Mavi çizgili mumlar */
            border-radius: 3px;
            width: 12px;
            height: 60px;
            position: relative;
            transform: translateY(-600px);
            animation: dropIn 1s ease-out forwards;
            box-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
        }

        /* Alev */
        .fire {
            position: absolute;
            top: -18px;
            left: 50%;
            transform: translateX(-50%);
            width: 10px;
            height: 16px;
            background: #ff7675;
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            animation: flicker 0.2s infinite alternate;
            box-shadow: 0 0 10px #ff7675; /* Alev parlaması */
        }
        
        .fire::after {
            content: '';
            position: absolute;
            top: 4px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 8px;
            background: #ffeaa7;
            border-radius: 50%;
        }

        /* Animasyonlar */
        @keyframes dropIn { to { transform: translateY(0); } }
        @keyframes textFadeIn { to { opacity: 1; transform: scale(1.1); } }
        @keyframes flicker {
            from { transform: translateX(-50%) scale(1); opacity: 0.9; }
            to { transform: translateX(-50%) scale(1.1); opacity: 1; }
        }

    </style>
</head>
<body>

    <canvas id="canvas"></canvas>

    <div class="message-container">
        <div class="message-title">Doğum Gününüz Kutlu Olsun</div>
        <div class="message-name">Sinan Abiciğim</div>
        <div class="message-note">Seni Çoook Seviyorum</div> </div>

    <div class="cake-wrapper">
        <div class="cake">
            <div class="icing"></div>
            <div class="candle-container">
                <div class="candle" style="animation-delay: 0.5s;"><div class="fire"></div></div>
                <div class="candle" style="animation-delay: 0.6s;"><div class="fire"></div></div>
                <div class="candle" style="animation-delay: 0.7s;"><div class="fire"></div></div>
                <div class="candle" style="animation-delay: 0.8s;"><div class="fire"></div></div>
                <div class="candle" style="animation-delay: 0.9s;"><div class="fire"></div></div>
                <div class="candle" style="animation-delay: 1.0s;"><div class="fire"></div></div>
                <div class="candle" style="animation-delay: 1.1s;"><div class="fire"></div></div>
                <div class="candle" style="animation-delay: 1.2s;"><div class="fire"></div></div>
                <div class="candle" style="animation-delay: 1.3s;"><div class="fire"></div></div>
                <div class="candle" style="animation-delay: 1.4s;"><div class="fire"></div></div>
            </div>
        </div>
        <div class="plate"></div>
    </div>

    <script>
        window.requestAnimFrame = (function(){
          return  window.requestAnimationFrame       || 
                  window.webkitRequestAnimationFrame || 
                  window.mozRequestAnimationFrame    || 
                  function( callback ){ window.setTimeout(callback, 1000 / 60); };
        })();

        var canvas = document.getElementById( 'canvas' ),
            ctx = canvas.getContext( '2d' ),
            cw = window.innerWidth,
            ch = window.innerHeight,
            fireworks = [],
            particles = [],
            hue = 120,
            limiterTotal = 5,
            limiterTick = 0,
            timerTotal = 20, 
            timerTick = 0,
            mousedown = false,
            mx, my;
            
        canvas.width = cw;
        canvas.height = ch;

        function random( min, max ) { return Math.random() * ( max - min ) + min; }
        function calculateDistance( p1x, p1y, p2x, p2y ) {
            var xDistance = p1x - p2x, yDistance = p1y - p2y;
            return Math.sqrt( Math.pow( xDistance, 2 ) + Math.pow( yDistance, 2 ) );
        }

        function Firework( sx, sy, tx, ty ) {
            this.x = sx; this.y = sy; this.sx = sx; this.sy = sy;
            this.tx = tx; this.ty = ty;
            this.distanceToTarget = calculateDistance( sx, sy, tx, ty );
            this.distanceTraveled = 0;
            this.coordinates = [];
            this.coordinateCount = 3;
            while( this.coordinateCount-- ) { this.coordinates.push( [ this.x, this.y ] ); }
            this.angle = Math.atan2( ty - sy, tx - sx );
            this.speed = 2;
            this.acceleration = 1.05;
            this.brightness = random( 50, 70 );
            this.targetRadius = 1;
        }

        Firework.prototype.update = function( index ) {
            this.coordinates.pop();
            this.coordinates.unshift( [ this.x, this.y ] );
            if( this.targetRadius < 8 ) { this.targetRadius += 0.3; } else { this.targetRadius = 1; }
            this.speed *= this.acceleration;
            var vx = Math.cos( this.angle ) * this.speed, vy = Math.sin( this.angle ) * this.speed;
            this.distanceTraveled = calculateDistance( this.sx, this.sy, this.x + vx, this.y + vy );
            if( this.distanceTraveled >= this.distanceToTarget ) {
                createParticles( this.tx, this.ty );
                fireworks.splice( index, 1 );
            } else { this.x += vx; this.y += vy; }
        }

        Firework.prototype.draw = function() {
            ctx.beginPath();
            ctx.moveTo( this.coordinates[ this.coordinates.length - 1 ][ 0 ], this.coordinates[ this.coordinates.length - 1 ][ 1 ] );
            ctx.lineTo( this.x, this.y );
            ctx.strokeStyle = 'hsl(' + hue + ', 100%, ' + this.brightness + '%)';
            ctx.stroke();
        }

        function Particle( x, y ) {
            this.x = x; this.y = y;
            this.coordinates = [];
            this.coordinateCount = 5;
            while( this.coordinateCount-- ) { this.coordinates.push( [ this.x, this.y ] ); }
            this.angle = random( 0, Math.PI * 2 );
            this.speed = random( 1, 10 );
            this.friction = 0.95;
            this.gravity = 1;
            this.hue = random( hue - 50, hue + 50 );
            this.brightness = random( 50, 80 );
            this.alpha = 1;
            this.decay = random( 0.015, 0.03 );
        }

        Particle.prototype.update = function( index ) {
            this.coordinates.pop();
            this.coordinates.unshift( [ this.x, this.y ] );
            this.speed *= this.friction;
            this.x += Math.cos( this.angle ) * this.speed;
            this.y += Math.sin( this.angle ) * this.speed + this.gravity;
            this.alpha -= this.decay;
            if( this.alpha <= this.decay ) { particles.splice( index, 1 ); }
        }

        Particle.prototype.draw = function() {
            ctx.beginPath();
            ctx.moveTo( this.coordinates[ this.coordinates.length - 1 ][ 0 ], this.coordinates[ this.coordinates.length - 1 ][ 1 ] );
            ctx.lineTo( this.x, this.y );
            ctx.strokeStyle = 'hsla(' + this.hue + ', 100%, ' + this.brightness + '%, ' + this.alpha + ')';
            ctx.stroke();
        }

        function createParticles( x, y ) {
            var particleCount = 50; 
            while( particleCount-- ) { particles.push( new Particle( x, y ) ); }
        }

        function loop() {
            requestAnimFrame( loop );
            hue += 0.5;
            ctx.globalCompositeOperation = 'destination-out';
            ctx.fillStyle = 'rgba(0, 0, 0, 0.5)'; 
            ctx.fillRect( 0, 0, cw, ch );
            ctx.globalCompositeOperation = 'lighter';
            
            var i = fireworks.length;
            while( i-- ) { fireworks[ i ].draw(); fireworks[ i ].update( i ); }
            
            var i = particles.length;
            while( i-- ) { particles[ i ].draw(); particles[ i ].update( i ); }

            if( timerTick >= timerTotal ) {
                if( !mousedown ) {
                    fireworks.push( new Firework( cw / 2, ch, random( 0, cw ), random( 0, ch / 2 ) ) );
                    timerTick = 0;
                }
            } else { timerTick++; }
            
            if( limiterTick >= limiterTotal ) {
                if( mousedown ) {
                    fireworks.push( new Firework( cw / 2, ch, mx, my ) );
                    limiterTick = 0;
                }
            } else { limiterTick++; }
        }

        canvas.addEventListener( 'mousemove', function( e ) { mx = e.pageX - canvas.offsetLeft; my = e.pageY - canvas.offsetTop; });
        canvas.addEventListener( 'mousedown', function( e ) { e.preventDefault(); mousedown = true; });
        canvas.addEventListener( 'mouseup', function( e ) { e.preventDefault(); mousedown = false; });
        window.onload = loop;
    </script>
</body>
</html>
