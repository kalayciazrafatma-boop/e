<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Çınar'ın Doğum Günü - Düzeltilmiş Layout</title>
    <style>
        /* --- GENEL AYARLAR --- */
        body {
            background: #000; /* Gece gökyüzü için siyah arka plan */
            margin: 0;
            overflow: hidden; /* Kaydırma çubuklarını gizle */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #fff;
        }

        /* --- ARKA PLAN (HAVAİ FİŞEK CANVA'SI) --- */
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 0; /* En arkada */
        }

        /* --- ÖN PLAN KAPSAYICI (TÜM İÇERİK) --- */
        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10; /* Havai fişeklerin önünde */
            position: relative;
            pointer-events: none; /* Tıklamaları arkadaki canvasa geçirir */
        }

        /* --- YAZI STİLLERİ --- */
        .message-container {
            text-align: center;
            /* PASTA İLE YAZI ARASINDAKİ AYRIMI GARANTİ ETMEK İÇIN MARJ ARTIRILDI */
            margin-bottom: 120px; 
            z-index: 15; /* Pastanın ve mumların önünde durması için yükseltildi */
        }

        .text-glow {
            opacity: 0; /* Başlangıçta gizli */
            transform: translateY(20px);
            animation: fadeInUp 1s ease-out forwards;
        }

        .message-title {
            font-size: 36px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 10px #00a8ff, 0 0 20px #00a8ff, 0 0 30px #00a8ff; /* Mavi neon */
            animation-delay: 0.5s;
        }

        .message-name {
            font-size: 54px;
            font-weight: 900;
            color: #fbc531; /* Altın sarısı */
            margin-top: 10px;
            text-shadow: 0 0 15px #e1b12c, 0 0 25px #e1b12c;
            animation-delay: 1.5s;
        }

        .message-seviyorum {
            font-size: 28px;
            font-weight: bold;
            color: #fbc531;
            margin-top: 15px;
            text-shadow: 0 0 10px #e1b12c;
            animation-delay: 2.5s;
        }

        /* Azra Ablan kısmı - İstediğin gibi en altta ve gri tonda */
        .message-note {
            font-size: 18px;
            color: #aaaaaa; /* Hafif gri */
            margin-top: 10px;
            letter-spacing: 2px;
            text-shadow: 0 0 5px rgba(255,255,255,0.3);
            animation-delay: 3.5s;
        }

        /* --- PASTA VE MUM STİLLERİ (ORİJİNAL RENKLER KORUNDU) --- */
        .cake-wrapper {
            position: relative;
            /* Pastayı ve mumları barındıran wrapper'a sabit yükseklik ve alan */
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
        }

        /* Tabak */
        .plate {
            width: 250px;
            height: 10px;
            background: #dfe6e9; /* Orijinal renk */
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(255,255,255,0.1);
        }

        /* Pastanın Keki */
        .cake {
            width: 220px;
            height: 90px;
            background: #2f3640; /* Koyu orijinal renk */
            position: absolute;
            bottom: 10px;
            left: 15px;
            border-radius: 10px 10px 5px 5px;
            box-shadow: inset -10px 0 0 rgba(0,0,0,0.2);
        }

        /* Krema */
        .icing {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 30px;
            background: #dcdde1; /* Beyaz-gri orijinal krema */
            border-radius: 10px 10px 20px 20px;
            z-index: 1;
        }

        /* Mum Konteynırı */
        .candle-container {
            display: flex;
            justify-content: center;
            gap: 6px;
            position: absolute;
            top: -40px;
            width: 100%;
            z-index: 2; /* Mumlar pastanın önünde */
        }

        /* Mumlar */
        .candle {
            background: repeating-linear-gradient(45deg, #00a8ff, #00a8ff 4px, #fff 4px, #fff 8px); /* Mavi-beyaz çizgili */
            border-radius: 3px;
            width: 8px;
            height: 50px;
            position: relative;
            box-shadow: 0 0 5px rgba(0,168,255,0.5);
            
            /* Düşme animasyonu */
            transform: translateY(-300px);
            animation: candleDrop 1s ease-out forwards;
        }

        /* Alev */
        .fire {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 8px;
            height: 14px;
            background: #ff7675; /* Ateş rengi */
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            background: radial-gradient(#ffead7, #ff7675);
            animation: flicker 0.2s infinite alternate, flameGlow 1s infinite alternate;
            box-shadow: 0 0 10px #ff7675, 0 0 20px #ff7675;
            opacity: 0; /* Başlangıçta sönük */
            animation-delay: 1.5s; /* Mumlar düştükten sonra yanacak */
        }
        
        /* Mum yandıktan sonra opacity'i açmak için sınıf */
        .candle-lit .fire {
            opacity: 1;
            transition: opacity 0.5s;
        }

        /* --- ANİMASYON TANIMLARI --- */
        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes candleDrop {
            to { transform: translateY(0); }
        }

        @keyframes flicker {
            from { transform: translateX(-50%) scale(1) rotate(-1deg); }
            to { transform: translateX(-50%) scale(1.05) rotate(1deg); }
        }

        @keyframes flameGlow {
            from { box-shadow: 0 0 10px #ff7675; }
            to { box-shadow: 0 0 15px #ff7675, 0 0 5px #e1b12c; }
        }

    </style>
</head>
<body>

    <!-- Havai Fişek Arka Planı -->
    <canvas id="canvas"></canvas>

    <!-- Ana İçerik -->
    <div class="main-container">
        <!-- Yazılar -->
        <div class="message-container">
            <div class="message-title text-glow">Doğum Günün Kutlu Olsun</div>
            <div class="message-name text-glow">Çınarcığım</div>
            <div class="message-seviyorum text-glow">Seni Çooook Seviyorum</div>
            <div class="message-note text-glow">Azra Ablan</div> 
        </div>

        <!-- Pasta -->
        <div class="cake-wrapper">
            <div class="cake">
                <div class="icing"></div>
                <!-- Mum Konteynırı - JS ile 9 mum eklenecek -->
                <div class="candle-container">
                </div>
            </div>
            <div class="plate"></div>
        </div>
    </div>

    <script>
        // --- MUM OLUSTURMA VE YAKMA ---
        const candleContainer = document.querySelector('.candle-container');
        // Orijinal görseldeki gibi tam 9 mum
        const numCandles = 9; 

        for (let i = 0; i < numCandles; i++) {
            const candle = document.createElement('div');
            candle.classList.add('candle');
            
            // Rastgele düşme gecikmesi
            const dropDelay = i * 0.1;
            candle.style.animationDelay = `${dropDelay}s`;
            
            const fire = document.createElement('div');
            fire.classList.add('fire');
            
            candle.appendChild(fire);
            candleContainer.appendChild(candle);

            // Mum düştükten sonra alevi yak
            setTimeout(() => {
                candle.classList.add('candle-lit');
            }, (dropDelay + 1) * 1000); // Düşme süresi (1s) + gecikme
        }

        // --- HAVAİ FİŞEK EFEKTİ (Canvas JS) ---
        // Basitleştirilmiş ve optimize edilmiş havai fişek kodu
        window.requestAnimFrame = (function(){
          return  window.requestAnimationFrame       || 
                  window.webkitRequestAnimationFrame || 
                  window.mozRequestAnimationFrame    || 
                  function( callback ){ window.setTimeout(callback, 1000 / 60); };
        })();

        var canvas = document.getElementById( 'canvas' ),
            ctx = canvas.getContext( '2d' ),
            cw = window.innerWidth,
            ch = window.innerHeight,
            fireworks = [],
            particles = [],
            hue = 120, // Başlangıç rengi
            timerTotal = 50, // Havai fişek sıklığı (düşük sayı = daha sık)
            timerTick = 0;
            
        canvas.width = cw;
        canvas.height = ch;

        function random( min, max ) { return Math.random() * ( max - min ) + min; }

        function calculateDistance( p1x, p1y, p2x, p2y ) {
            var xDistance = p1x - p2x, yDistance = p1y - p2y;
            return Math.sqrt( Math.pow( xDistance, 2 ) + Math.pow( yDistance, 2 ) );
        }

        // Havai Fişek Roketi
        function Firework( sx, sy, tx, ty ) {
            this.x = sx; this.y = sy; this.sx = sx; this.sy = sy;
            this.tx = tx; this.ty = ty;
            this.distanceToTarget = calculateDistance( sx, sy, tx, ty );
            this.distanceTraveled = 0;
            this.coordinates = [];
            this.coordinateCount = 3;
            while( this.coordinateCount-- ) { this.coordinates.push( [ this.x, this.y ] ); }
            this.angle = Math.atan2( ty - sy, tx - sx );
            this.speed = 2;
            this.acceleration = 1.05;
            this.brightness = random( 50, 70 );
        }

        Firework.prototype.update = function( index ) {
            this.coordinates.pop();
            this.coordinates.unshift( [ this.x, this.y ] );
            this.speed *= this.acceleration;
            var vx = Math.cos( this.angle ) * this.speed, vy = Math.sin( this.angle ) * this.speed;
            this.distanceTraveled = calculateDistance( this.sx, this.sy, this.x + vx, this.y + vy );
            
            if( this.distanceTraveled >= this.distanceToTarget ) {
                createParticles( this.tx, this.ty, this.brightness );
                fireworks.splice( index, 1 );
            } else { this.x += vx; this.y += vy; }
        }

        Firework.prototype.draw = function() {
            ctx.beginPath();
            ctx.moveTo( this.coordinates[ this.coordinates.length - 1 ][ 0 ], this.coordinates[ this.coordinates.length - 1 ][ 1 ] );
            ctx.lineTo( this.x, this.y );
            ctx.strokeStyle = 'hsl(' + hue + ', 100%, ' + this.brightness + '%)';
            ctx.stroke();
        }

        // Patlama Parçacıkları
        function Particle( x, y, fireworkBrightness ) {
            this.x = x; this.y = y;
            this.coordinates = [];
            this.coordinateCount = 5;
            while( this.coordinateCount-- ) { this.coordinates.push( [ this.x, this.y ] ); }
            this.angle = random( 0, Math.PI * 2 );
            this.speed = random( 1, 10 );
            this.friction = 0.95;
            this.gravity = 1;
            // Renk paleti: Altın (#fbc531) ve Mavi (#00a8ff) ağırlıklı
            if(Math.random() > 0.5) {
                this.hue = random(35, 50); // Altın/Sarı tonları
            } else {
                this.hue = random(190, 210); // Mavi tonları
            }
            this.brightness = random( fireworkBrightness - 10, fireworkBrightness + 20 );
            this.alpha = 1;
            this.decay = random( 0.015, 0.03 ); // Kaybolma hızı
        }

        Particle.prototype.update = function( index ) {
            this.coordinates.pop();
            this.coordinates.unshift( [ this.x, this.y ] );
            this.speed *= this.friction;
            this.x += Math.cos( this.angle ) * this.speed;
            this.y += Math.sin( this.angle ) * this.speed + this.gravity;
            this.alpha -= this.decay;
            if( this.alpha <= this.decay ) { particles.splice( index, 1 ); }
        }

        Particle.prototype.draw = function() {
            ctx.beginPath();
            ctx.moveTo( this.coordinates[ this.coordinates.length - 1 ][ 0 ], this.coordinates[ this.coordinates.length - 1 ][ 1 ] );
            ctx.lineTo( this.x, this.y );
            // Parlaklık efekti için alpha kullanımı
            ctx.strokeStyle = 'hsla(' + this.hue + ', 100%, ' + this.brightness + '%, ' + this.alpha + ')';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        function createParticles( x, y, brightness ) {
            var particleCount = 40; 
            while( particleCount-- ) { particles.push( new Particle( x, y, brightness ) ); }
        }

        // Ana Döngü
        function loop() {
            requestAnimFrame( loop );
            
            // Arka planı hafifçe temizle (iz bırakma efekti için)
            ctx.globalCompositeOperation = 'destination-out';
            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)'; 
            ctx.fillRect( 0, 0, cw, ch );
            // Parçacıkları "lighter" moduyla çiz (parlama efekti)
            ctx.globalCompositeOperation = 'lighter';
            
            // Roketleri güncelle ve çiz
            var i = fireworks.length;
            while( i-- ) { fireworks[ i ].draw(); fireworks[ i ].update( i ); }
            
            // Parçacıkları güncelle ve çiz
            var i = particles.length;
            while( i-- ) { particles[ i ].draw(); particles[ i ].update( i ); }

            // Otomatik havai fişek fırlat
            if( timerTick >= timerTotal ) {
                // Rastgele bir hedef noktası seç (ekranın üst yarısı)
                var targetX = random(cw * 0.1, cw * 0.9);
                var targetY = random(ch * 0.1, ch * 0.5);
                fireworks.push( new Firework( cw / 2, ch, targetX, targetY ) );
                timerTick = 0;
            } else { timerTick++; }
        }

        // Pencere boyutu değiştiğinde canvas'ı güncelle
        window.addEventListener('resize', function() {
            cw = window.innerWidth;
            ch = window.innerHeight;
            canvas.width = cw;
            canvas.height = ch;
        });

        // Başlat
        window.onload = loop;
    </script>
</body>
</html>
